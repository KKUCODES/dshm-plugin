name: Build plugin packages

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['src/**', 'lib/**', 'scripts/**', 'tests/github-package.test.mjs', 'ci/**', 'package*.json', 'tsconfig*.json', 'cordis.patch.yml', '.github/workflows/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_draft:
        description: 'Create an unpublished prerelease draft'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: plugin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dsh: ['0.2.0-rc.2', '0.2.1-alpha.1', '0.2.1-alpha.2']
    env:
      DSHM_DSH_VERSION: ${{ matrix.dsh }}
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: plugin
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            plugin/package-lock.json
            plugin/ci/sdk/*/package-lock.json
      - id: config
        run: node scripts/ci-version.mjs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: KKUCODES/dshm-relay
          ref: ${{ steps.config.outputs.backend_ref }}
          path: backend
          persist-credentials: false
      - name: Build shared protocol
        working-directory: backend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build --workspace @dsh-mobile/protocol
      - name: Prepare pinned SDK and build packages
        run: |
          npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
          npm run prepare:ci
          npm run build:ci
      - name: Verify committed GitHub install package
        if: matrix.dsh == '0.2.1-alpha.2'
        run: |
          DSHM_DSH_VERSION=0.2.0-rc.2 npm run prepare:ci
          npm run test:compat
          npm run test:github
          npm run build:github -- --check
      - name: Install into an unmodified official DSH and verify Web startup
        if: matrix.dsh != '0.2.1-alpha.1'
        run: |
          npm install --global pnpm@11.7.0 --ignore-scripts --no-audit --no-fund
          npm run verify:github
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dshm-plugin-${{ matrix.dsh }}
          retention-days: 30
          if-no-files-found: error
          path: |
            plugin/artifacts/ci/packages/dshm-plugin-*.tgz
            plugin/artifacts/ci/packages/*.sha256
            plugin/artifacts/ci/packages/compatibility-*.json

  release:
    needs: build
    if: github.repository == 'KKUCODES/dshm-plugin' && (github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.release_draft))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dshm-plugin-*
          merge-multiple: true
          path: release-files
      - name: Create release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(node -p "require('./ci/release.json').version")
          cat > release-files/RELEASE-NOTES.md <<'NOTES'
          DSHM plugin development candidate. Choose the archive matching your official DSH version exactly.

          - DSH 0.2.0-rc.2, 0.2.1-alpha.1 and 0.2.1-alpha.2 have separate archive packages.
          - The default GitHub package supports both 0.2.0-rc.2 and 0.2.1-alpha.2.
          - Install through the official DSH plugin command; no core patches are included.
          - CI packaging is verified separately from real Android and full compatibility validation.
          - SHA-256 and compatibility metadata are included.
          NOTES
          tag="v$version"
          if gh release view "$tag" --json isDraft,targetCommitish > release-state.json 2>/dev/null; then
            node -e 'const r=require("./release-state.json"); if (!r.isDraft || r.targetCommitish !== process.env.GITHUB_SHA) throw Error("Only a draft for the same commit can be updated")'
            # 未发布草稿可能尚未创建 Git 标签；已有标签按 commit 解析，兼容 annotated tag。
            gh api "repos/$GH_REPO/git/matching-refs/tags/$tag" > tag-refs.json
            if node -e 'const refs=require("./tag-refs.json"); process.exit(refs.some(r=>r.ref === "refs/tags/"+process.argv[1]) ? 0 : 1)' "$tag"; then
              target=$(gh api "repos/$GH_REPO/commits/$tag" --jq '.sha')
              test "$target" = "$GITHUB_SHA"
            fi
            gh release upload "$tag" release-files/*.tgz release-files/*.sha256 release-files/*.json --clobber
          else
            gh release create "$tag" release-files/*.tgz release-files/*.sha256 release-files/*.json --target "$GITHUB_SHA" --draft --prerelease --title "DSHM Plugin $version" --notes-file release-files/RELEASE-NOTES.md
          fi
